name: ci
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npx --yes @redocly/cli@2 lint packages/contract/openapi.yaml --config packages/contract/redocly.yaml

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: maven }
      - name: Create roles and database
        working-directory: .
        run: psql "postgresql://postgres:postgres_dev@localhost:5432/postgres" -v ON_ERROR_STOP=1 -f infra/postgres/init/01-roles-and-db.sql
      - name: Build and test (unit + integration + sync chaos/property tests against Postgres 16)
        env:
          TARAZU_TEST_DB_URL: jdbc:postgresql://localhost:5432/tarazu
        run: mvn -B -ntp verify

  # The 100,000-operation backlog upload + full replay (tagged "scale"; about 5 minutes) runs in parallel with the rest.
  api-scale:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: maven }
      - name: Create roles and database
        working-directory: .
        run: psql "postgresql://postgres:postgres_dev@localhost:5432/postgres" -v ON_ERROR_STOP=1 -f infra/postgres/init/01-roles-and-db.sql
      - name: 100k-operation replay
        env:
          TARAZU_TEST_DB_URL: jdbc:postgresql://localhost:5432/tarazu
        run: mvn -B -ntp verify -Dtarazu.it.excludedGroups=none -Dgroups=scale -Dit.test=ReplayScaleIT -Dtest=NONE -Dsurefire.failIfNoSpecifiedTests=false

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: First-load JS must stay within 250 KB gzipped
        run: npm run size
      - name: Generated API types must match the contract
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/schema.d.ts
