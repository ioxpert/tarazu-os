name: ci
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npx --yes @redocly/cli@2 lint packages/contract/openapi.yaml --config packages/contract/redocly.yaml

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: maven }
      - name: Create roles and database
        working-directory: .
        run: psql "postgresql://postgres:postgres_dev@localhost:5432/postgres" -v ON_ERROR_STOP=1 -f infra/postgres/init/01-roles-and-db.sql
      - name: Build and test (unit + integration against Postgres 16)
        env:
          TARAZU_TEST_DB_URL: jdbc:postgresql://localhost:5432/tarazu
        run: mvn -B -ntp verify

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: First-load JS budget (250 KB gzip)
        run: npm run size
      - name: Generated API types must match the contract
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/schema.d.ts

  web-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Offline billing, returns, split tender, perf budgets (real SQLite WASM in Chromium, no backend)
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results
