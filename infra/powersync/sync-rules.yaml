# PowerSync sync rules for Tarazu OS.  DRAFT: NOT exercised in CI (no PowerSync service runs there).
# Validate with the PowerSync dashboard / CLI against a real service before relying on it.
#
# Bucket key = merchant_id (= our tenant id), taken from the device JWT minted by GET /v1/sync/credentials
# (claim `merchant_id`). One bucket per merchant: every device of a merchant downloads the same read model.
# Writes never go through PowerSync: devices upload operations to POST /v1/sync/upload (see TarazuConnector).
#
# Column lists must match apps/web/src/sync/schema.ts (READ_MODEL_TABLES). PowerSync needs a text `id`;
# tables with composite keys get a synthetic one, and the web schema documents the same recipe.
bucket_definitions:
  by_merchant:
    parameters: SELECT request.jwt() ->> 'merchant_id' AS merchant_id
    data:
      # uom is jsonb on the server; PowerSync would sync it as JSON text anyway, the explicit CAST documents that the
      # client column is text (UomSpec JSON, see the contract). Booleans arrive as 0/1 integers.
      - SELECT id, tenant_id, name, barcode, sku, hsn, unit, local_name, brand, category, pack_sku,
               CAST(uom AS text) AS uom, tax_inclusive, tax_rate_bp, loose, pinned, active, updated_at
        FROM product WHERE tenant_id = bucket.merchant_id
      - SELECT id, tenant_id, name, party_type, phone, gstin, credit_limit_paise, active, merged_into, updated_at
        FROM party WHERE tenant_id = bucket.merchant_id
      # party_id is set only for price_type 'customer' (a negotiated price for one party)
      - SELECT id, tenant_id, product_id, party_id, price_type, amount_paise, effective_from, hlc
        FROM price_version WHERE tenant_id = bucket.merchant_id
      # projection: id = store_id:product_id
      - SELECT store_id || ':' || product_id AS id, tenant_id, store_id, product_id, qty_milli, oversold, movement_count
        FROM stock_balance WHERE tenant_id = bucket.merchant_id
      # projection: id = party_id
      - SELECT party_id AS id, tenant_id, party_id, balance_paise, entry_count
        FROM khata_balance WHERE tenant_id = bucket.merchant_id
      # the statement lines behind the balance
      - SELECT id, tenant_id, store_id, party_id, direction, amount_paise, ref_type, ref_id, note, occurred_at
        FROM khata_entry WHERE tenant_id = bucket.merchant_id
      - SELECT id, tenant_id, store_id, device_id, series, number, doc_type, invoice_date, party_id, subtotal_paise,
               discount_paise, tax_paise, round_off_paise, total_paise, hlc, created_at
        FROM invoice WHERE tenant_id = bucket.merchant_id
      # id = invoice_id:line_no
      - SELECT invoice_id || ':' || line_no AS id, tenant_id, invoice_id, line_no, product_id, qty_milli,
               unit_price_paise, discount_paise, hsn, tax_rate_bp, tax_paise, line_total_paise
        FROM invoice_line WHERE tenant_id = bucket.merchant_id
      # lines is jsonb on the server (typed credit-note lines), text on the client
      - SELECT id, tenant_id, store_id, device_id, series, number, invoice_id, party_id, reason, total_paise,
               CAST(lines AS text) AS lines, hlc, created_at
        FROM credit_note WHERE tenant_id = bucket.merchant_id
      - SELECT id, tenant_id, store_id, device_id, opening_cash_paise, opened_at
        FROM shift WHERE tenant_id = bucket.merchant_id
      # id = the shift_close row id (NOT shift_id: apps/web/src/sync/schema.ts has a stale comment saying shift_id)
      - SELECT id, tenant_id, store_id, device_id, shift_id, declared_cash_paise, expected_cash_paise, variance_paise, closed_at
        FROM shift_close WHERE tenant_id = bucket.merchant_id
      - SELECT id, tenant_id, store_id, device_id, series, number, supplier_id, supplier_ref, receipt_date, total_paise,
               lines::text AS lines, hlc, created_at
        FROM purchase_receipt WHERE tenant_id = bucket.merchant_id
      - SELECT id, tenant_id, store_id, party_id, invoice_id, direction, mode, amount_paise, reference, occurred_at
        FROM payment WHERE tenant_id = bucket.merchant_id
      - SELECT id, tenant_id, store_id, party_id, state, updated_at
        FROM sales_order WHERE tenant_id = bucket.merchant_id

  # Global reference data (no parameters = one bucket every device gets). Rate changes reach devices without an app release.
  global_tax_rules:
    data:
      - SELECT id, hsn_prefix, description, rate_bp, cess_bp, effective_from, notification_ref FROM tax_rule
