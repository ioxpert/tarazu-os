openapi: 3.1.0
info:
  title: Tarazu OS API
  version: 0.0.1
  description: |
    Single contract for web today and Android/iOS later. Clients are generated from this file
    (see apps/web `npm run gen:api`). Keep it in lockstep with services/api.
    Auth is not final: until OTP login + device-bound JWT land, /v1/** returns 401 unless the
    server runs with the dev-only tenant header switch.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
paths:
  /actuator/health:
    get:
      operationId: getHealth
      summary: Liveness and database health
      security: []
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /v1/sync/upload:
    post:
      operationId: uploadOperations
      summary: Upload a batch from the device outbox (PowerSync uploadData)
      description: |
        Idempotent. Replaying a batch is safe: rows with a known idempotencyKey or operationId are
        counted as duplicates. The batch is atomic; a 422 means nothing was stored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadRequest'
      responses:
        '200':
          description: Batch processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
        '400':
          description: Validation failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Not authenticated
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Unknown store or device for this tenant
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Device-bound JWT from OTP login (not implemented yet; see info.description).
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          examples: [UP]
    Operation:
      type: object
      required: [operationId, storeId, deviceId, localSeq, hlc, idempotencyKey, entityType, entityId, opType, schemaVersion, payload]
      properties:
        operationId: { type: string, format: uuid, description: UUIDv7 }
        storeId: { type: string, format: uuid }
        deviceId: { type: string, format: uuid }
        localSeq: { type: integer, format: int64, minimum: 0 }
        hlc: { type: string, maxLength: 64, description: Hybrid logical clock }
        idempotencyKey: { type: string, minLength: 1, maxLength: 128 }
        entityType: { type: string, minLength: 1, maxLength: 64 }
        entityId: { type: string, format: uuid }
        opType: { type: string, enum: [create, update, void] }
        schemaVersion: { type: integer, minimum: 1 }
        payload: { type: object, additionalProperties: true }
    UploadRequest:
      type: object
      required: [operations]
      properties:
        operations:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/Operation'
    UploadResponse:
      type: object
      required: [accepted, duplicates]
      properties:
        accepted: { type: integer, description: Newly stored }
        duplicates: { type: integer, description: Already stored }
    Problem:
      type: object
      properties:
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
