spring.application.name=tarazu-api
spring.threads.virtual.enabled=true

# App connects as a NON-superuser, NON-owner role so Postgres RLS always applies.
# Migrations run as the admin role. Dev defaults only; real values come from env/secret store.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tarazu}
spring.datasource.username=${DB_APP_USER:tarazu_app}
spring.datasource.password=${DB_APP_PASSWORD:tarazu_app_dev}

spring.flyway.url=${DB_URL:jdbc:postgresql://localhost:5432/tarazu}
spring.flyway.user=${DB_ADMIN_USER:tarazu_admin}
spring.flyway.password=${DB_ADMIN_PASSWORD:tarazu_admin_dev}
spring.flyway.placeholders.app_role=${DB_APP_USER:tarazu_app}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# SECURITY: /v1/** fails closed. Devices authenticate with the bearer token issued at registration
# (identity.DeviceTokenAuthenticator). OTP owner login is a later PR; until then owners are provisioned by ops.
# The dev tenant header below exists only for local dev and tests. Never enable in production.
tarazu.auth.dev-header-enabled=false

# Staff PIN hashing cost (PBKDF2-HMAC-SHA256). Tests lower it for speed.
tarazu.pin.iterations=600000

# Self-hosted PowerSync service. Unset = GET /v1/sync/credentials answers 503 (never a default key).
# secret is base64url, shared with the PowerSync service's HS256 key.
tarazu.sync.powersync.url=${POWERSYNC_URL:}
tarazu.sync.powersync.secret=${POWERSYNC_JWT_SECRET:}

# OTP onboarding / login (ADR 0007). Unset pepper = the OTP endpoints answer 503 (never a default secret).
# mode: EMAIL | PHONE | EITHER | BOTH   (which contact proof signup needs; login works on any enabled channel the account has)
tarazu.auth.otp.mode=${OTP_MODE:EITHER}
tarazu.auth.otp.pepper=${OTP_PEPPER:}
# DEV ONLY: write codes to the log instead of sending them. Never in production.
tarazu.auth.otp.dev-log-codes=false

# OTP delivery. Email: set spring.mail.* (host, port, username, password) and the sender address.
#   SPRING_MAIL_HOST=smtp.example.com SPRING_MAIL_USERNAME=... SPRING_MAIL_PASSWORD=... OTP_EMAIL_FROM=no-reply@yourdomain
tarazu.auth.otp.email.from=${OTP_EMAIL_FROM:}
# SMS: any HTTPS gateway taking a JSON POST. body-template placeholders: {{to}} (E.164), {{message}}, {{templateId}} (DLT template id).
#   TARAZU_AUTH_OTP_SMS_URL=https://gateway.example/send OTP_SMS_AUTH_VALUE='Bearer ...' OTP_SMS_TEMPLATE_ID=...
# The SMS text (tarazu.auth.otp.sms.message) must match the template registered with the operator.
# the SMS sender exists only when this key is present (do not define it empty):  TARAZU_AUTH_OTP_SMS_URL=https://...
tarazu.auth.otp.sms.auth-value=${OTP_SMS_AUTH_VALUE:}
tarazu.auth.otp.sms.template-id=${OTP_SMS_TEMPLATE_ID:}

# Device pairing (ADR 0015). Needs OTP_PEPPER (codes are stored as keyed hashes; unset = 503). Codes are 8 characters (40 bits),
# single use. max-failures is the deployment-wide budget of wrong/expired codes per window before redemption answers 429.
tarazu.pairing.ttl-minutes=10
tarazu.pairing.max-failures=30
tarazu.pairing.window-minutes=10
