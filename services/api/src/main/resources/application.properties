spring.application.name=tarazu-api
spring.threads.virtual.enabled=true

# App connects as a NON-superuser, NON-owner role so Postgres RLS always applies.
# Migrations run as the admin role. Dev defaults only; real values come from env/secret store.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tarazu}
spring.datasource.username=${DB_APP_USER:tarazu_app}
spring.datasource.password=${DB_APP_PASSWORD:tarazu_app_dev}

spring.flyway.url=${DB_URL:jdbc:postgresql://localhost:5432/tarazu}
spring.flyway.user=${DB_ADMIN_USER:tarazu_admin}
spring.flyway.password=${DB_ADMIN_PASSWORD:tarazu_admin_dev}
spring.flyway.placeholders.app_role=${DB_APP_USER:tarazu_app}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# SECURITY: /v1/** fails closed. Devices authenticate with the bearer token issued at registration
# (identity.DeviceTokenAuthenticator). OTP owner login is a later PR; until then owners are provisioned by ops.
# The dev tenant header below exists only for local dev and tests. Never enable in production.
tarazu.auth.dev-header-enabled=false

# Staff PIN hashing cost (PBKDF2-HMAC-SHA256). Tests lower it for speed.
tarazu.pin.iterations=600000

# Self-hosted PowerSync service. Unset = GET /v1/sync/credentials answers 503 (never a default key).
# secret is base64url, shared with the PowerSync service's HS256 key.
tarazu.sync.powersync.url=${POWERSYNC_URL:}
tarazu.sync.powersync.secret=${POWERSYNC_JWT_SECRET:}
